services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: patent-intel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage  # ← removed ./data mount from here
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patent-intel-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-patent_chunks}
      - CHUNKS_PATH=${CHUNKS_PATH:-data/processed/patent_chunks.json}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}  # ← fixed
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}                                          # ← fixed
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-bge-m3}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      - BM25_K1=${BM25_K1:-1.5}
      - BM25_B=${BM25_B:-0.75}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}  # ← fixed (was llama3.1:8b)
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-180}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./scripts:/app/scripts
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped